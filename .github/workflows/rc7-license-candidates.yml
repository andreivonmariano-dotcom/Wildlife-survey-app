name: LIKAS RC7A license-eligible species photographs
on:
  push:
    branches: [feature/likas-core-fieldwork-post-rc4]
    paths:
      - scripts/collect_rc7_inaturalist_candidates.py
      - .github/workflows/rc7-license-candidates.yml
permissions:
  contents: read
jobs:
  candidates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python3 scripts/collect_rc7_inaturalist_candidates.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: LIKAS-RC7A-iNat-photo-license-candidates
          path: rc7_inat_licensed_candidates.json
          retention-days: 14
