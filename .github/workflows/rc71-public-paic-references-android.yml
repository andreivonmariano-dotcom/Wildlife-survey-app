name: LIKAS RC71 Public PAIC714 and WorldCover APK
on:
  push:
    branches:
      - feature/likas-rc71-public-preloaded-paic-references
  workflow_dispatch:
permissions:
  contents: read
jobs:
  signed-preloaded-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - run: sdkmanager --install 'platforms;android-35' 'build-tools;35.0.0' 'platform-tools'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - uses: actions/cache@v4
        with:
          path: .taxonomy-cache/mdd-v2.5.csv
          key: mdd-v2.5-533e662fd5b8f66a5f56c191e7efac44
      - uses: actions/cache/restore@v4
        with:
          path: .signing/wildlife-beta08.keystore
          key: wildlife-v08-beta-debug-signing-v1
      - name: Verify source inputs, public license and retained signer
        run: |
          test -s .signing/wildlife-beta08.keystore
          keytool -exportcert -keystore .signing/wildlife-beta08.keystore -storepass android -alias androiddebugkey -file /tmp/likas-cert.der
          echo 'f7c471ad310aeeffd2b2a7cf7c371c6efdce258560a818b52be5e1f2a7509937  /tmp/likas-cert.der' | sha256sum -c -
          echo '1ebf7c4ac50787b2dd6f3c22a484057fbac7e61188101bd2f2002c5ce65de959  app/src/main/assets/paic714_master.csv' | sha256sum -c -
          echo 'e86e0a90096e104f09ee195b70c6cfe44bd6600211a44229973a3a0c80344089  app/src/main/assets/paic_worldcover2020_500m.txt' | sha256sum -c -
          grep -F 'versionCode 131' app/build.gradle
          grep -F "applicationId 'org.phwildlife.survey.beta08'" app/build.gradle
          grep -F 'super(context,NAME,null,28)' app/src/main/java/org/phwildlife/survey/FieldDb.java
          grep -F 'CC BY 4.0' app/src/main/assets/PAIC_WORLD_COVER_ATTRIBUTION.txt
      - name: Scientific source and exact data regressions
        run: |
          python3 -m unittest discover -s scripts -p 'test_*.py'
          python3 scripts/prepare_mdd_mammals.py
          python3 scripts/prepare_offline_photos.py
          python3 scripts/audit_inaturalist_photos.py --install-approved
      - name: JVM tests and signed Android APK compilation
        run: gradle --no-daemon :app:testDebugUnitTest :app:assembleDebug :app:assembleDebugAndroidTest
      - name: Check data actually inside the APK, package, signer and integrity
        shell: bash
        run: |
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          unzip -t "$APK" | tail -n 1
          unzip -p "$APK" assets/paic714_master.csv | sha256sum | grep -F '1ebf7c4ac50787b2dd6f3c22a484057fbac7e61188101bd2f2002c5ce65de959'
          unzip -p "$APK" assets/paic_worldcover2020_500m.txt | sha256sum | grep -F 'e86e0a90096e104f09ee195b70c6cfe44bd6600211a44229973a3a0c80344089'
          unzip -p "$APK" assets/PAIC_WORLD_COVER_ATTRIBUTION.txt | grep -F 'CC BY 4.0'
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | grep -F "name='org.phwildlife.survey.beta08' versionCode='131'"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK" | grep -iF 'f7c471ad310aeeffd2b2a7cf7c371c6efdce258560a818b52be5e1f2a7509937'
      - name: Upload final preloaded reference APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: LIKAS-v0.27.3-RC71-PAIC714-WorldCover-code131-embedded
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
