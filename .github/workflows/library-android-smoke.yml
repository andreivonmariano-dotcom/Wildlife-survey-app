name: LIKAS Android Library Smoke

# Expensive emulator acceptance is deliberate, not triggered by each source commit.
on:
  workflow_dispatch:

concurrency:
  group: likas-library-device-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  library-device-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - uses: actions/cache/restore@v4
        with:
          path: .signing/wildlife-beta08.keystore
          key: wildlife-v08-beta-debug-signing-v1
      - name: Require original app signer
        run: |
          test -s .signing/wildlife-beta08.keystore
          keytool -exportcert -keystore .signing/wildlife-beta08.keystore -storepass android -alias androiddebugkey -file /tmp/likas-ui-signing.der
          echo 'f7c471ad310aeeffd2b2a7cf7c371c6efdce258560a818b52be5e1f2a7509937  /tmp/likas-ui-signing.der' | sha256sum -c -
      - name: Prepare only approved offline photographs
        run: |
          python3 scripts/prepare_offline_photos.py
          python3 scripts/audit_inaturalist_photos.py --install-approved
      - name: Real Android 14 launch and carousel smoke
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_2
          cores: 2
          ram-size: 2048M
          heap-size: 512M
          disk-size: 4G
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: |
            gradle --no-daemon :app:connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=org.phwildlife.survey.Rc35DiscoveryNullStatusInstrumentedTest,org.phwildlife.survey.Rc36LibrarySwipeInstrumentedTest
      - name: Archive failures for diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: LIKAS-RC36-device-smoke-failures
          path: |
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
          if-no-files-found: ignore
          retention-days: 7
