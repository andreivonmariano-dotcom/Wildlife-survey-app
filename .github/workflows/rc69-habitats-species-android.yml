name: LIKAS RC69 Habitats and Species preflight
on:
  push:
    branches:
      - feature/likas-rc69-habitats-species-preflight
  pull_request:
    branches:
      - feature/likas-rc68-mindanao-paic714-species-library
  workflow_dispatch:
permissions:
  contents: read
jobs:
  habitats-species-build:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - run: sdkmanager --install 'platforms;android-35' 'build-tools;35.0.0' 'platform-tools'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - uses: actions/cache@v4
        with:
          path: .taxonomy-cache/mdd-v2.5.csv
          key: mdd-v2.5-533e662fd5b8f66a5f56c191e7efac44
      - uses: actions/cache/restore@v4
        with:
          path: .signing/wildlife-beta08.keystore
          key: wildlife-v08-beta-debug-signing-v1
      - name: Verify existing signing identity and schema
        run: |
          test -s .signing/wildlife-beta08.keystore
          keytool -exportcert -keystore .signing/wildlife-beta08.keystore -storepass android -alias androiddebugkey -file /tmp/likas-cert.der
          echo 'f7c471ad310aeeffd2b2a7cf7c371c6efdce258560a818b52be5e1f2a7509937  /tmp/likas-cert.der' | sha256sum -c -
          grep -F "applicationId 'org.phwildlife.survey.beta08'" app/build.gradle
          grep -F "versionCode 129" app/build.gradle
          grep -F "super(context,NAME,null,28)" app/src/main/java/org/phwildlife/survey/FieldDb.java
      - name: Scientific source regressions
        run: |
          python3 -m unittest discover -s scripts -p 'test_*.py'
          python3 scripts/prepare_mdd_mammals.py
          python3 scripts/prepare_offline_photos.py
          python3 scripts/audit_inaturalist_photos.py --install-approved
      - name: JVM policy tests and signed preview compilation
        run: gradle --no-daemon :app:testDebugUnitTest :app:assembleDebug :app:assembleDebugAndroidTest
      - name: Upload code129 APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: LIKAS-v0.27.3-RC69-Habitats-Species-code129-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
      - name: Upload unit-test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: LIKAS-RC69-unit-test-evidence
          path: |
            app/build/reports/tests/
            app/build/test-results/
          retention-days: 7
          if-no-files-found: warn
