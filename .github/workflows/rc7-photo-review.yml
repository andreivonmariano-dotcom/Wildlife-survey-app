name: LIKAS RC7 inat photo review contact sheet
on:
  push:
    branches: [feature/likas-core-fieldwork-post-rc4]
    paths:
      - scripts/make_rc7_photo_contact_sheet.py
      - .github/workflows/rc7-photo-review.yml
permissions:
  contents: read
jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install Pillow
      - run: python3 scripts/collect_rc7_inaturalist_candidates.py
      - run: python3 scripts/make_rc7_photo_contact_sheet.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: LIKAS-RC7-iNat-licensed-visual-review
          path: rc7_photo_review/
          retention-days: 7
