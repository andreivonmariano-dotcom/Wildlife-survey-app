name: LIKAS RC56 screen 5 Live Recorder layout and scientific regression
on:
  push:
    branches:
      - feature/likas-rc56-live-recorder-screen5
  workflow_dispatch:
permissions:
  contents: read
jobs:
  recorder-android:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - run: sdkmanager --install 'platforms;android-35' 'build-tools;35.0.0' 'platform-tools'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - uses: actions/cache@v4
        with:
          path: .taxonomy-cache/mdd-v2.5.csv
          key: mdd-v2.5-533e662fd5b8f66a5f56c191e7efac44
      - uses: actions/cache/restore@v4
        with:
          path: .signing/wildlife-beta08.keystore
          key: wildlife-v08-beta-debug-signing-v1
      - name: Check original LIKAS signing identity
        run: |
          test -s .signing/wildlife-beta08.keystore
          keytool -exportcert -keystore .signing/wildlife-beta08.keystore -storepass android -alias androiddebugkey -file /tmp/likas-cert.der
          echo 'f7c471ad310aeeffd2b2a7cf7c371c6efdce258560a818b52be5e1f2a7509937  /tmp/likas-cert.der' | sha256sum -c -
      - name: Scientific regressions and signed APK compile
        run: |
          python3 -m unittest discover -s scripts -p 'test_*.py'
          python3 scripts/prepare_mdd_mammals.py
          python3 scripts/prepare_offline_photos.py
          python3 scripts/audit_inaturalist_photos.py --install-approved
          gradle --no-daemon :app:testDebugUnitTest :app:assembleDebug :app:assembleDebugAndroidTest
      - name: Allow KVM acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Android 14 recorder, prior UI, and research ZIP acceptance
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_2
          cores: 2
          ram-size: 2048M
          heap-size: 512M
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          script: bash scripts/rc56_recorder_emulator_acceptance.sh
      - name: Publish signed RC56 preview APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: LIKAS-v0.27.3-RC56-code116-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 5
      - name: Preserve Android screen and test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: LIKAS-RC56-screen5-recorder-emulator-evidence
          path: |
            emulator-qa/
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
          if-no-files-found: warn
          retention-days: 7
