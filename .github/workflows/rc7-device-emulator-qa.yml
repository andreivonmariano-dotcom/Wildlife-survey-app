name: LIKAS Android emulator upgrade and backup QA
on:
  push:
    branches: [feature/likas-core-fieldwork-post-rc4]
    paths:
      - scripts/run_emulator_rc7_qa.sh
      - app/src/androidTest/**
      - app/src/main/java/org/phwildlife/survey/**
      - scripts/prepare_offline_photos.py
      - scripts/audit_inaturalist_photos.py
      - app/build.gradle
      - .github/workflows/rc7-device-emulator-qa.yml
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  android-emulator:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - uses: actions/cache@v4
        with:
          path: .taxonomy-cache/mdd-v2.5.csv
          key: mdd-v2.5-533e662fd5b8f66a5f56c191e7efac44
      - uses: actions/cache/restore@v4
        with:
          path: .signing/wildlife-beta08.keystore
          key: wildlife-v08-beta-debug-signing-v1
      - name: Verify signing continuity
        run: |
          test -s .signing/wildlife-beta08.keystore
          keytool -exportcert -keystore .signing/wildlife-beta08.keystore -storepass android -alias androiddebugkey -file /tmp/likas-cert.der
          echo 'f7c471ad310aeeffd2b2a7cf7c371c6efdce258560a818b52be5e1f2a7509937  /tmp/likas-cert.der' | sha256sum -c -
      - name: Download pinned older RC7C APK for real install-upgrade test
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api "/repos/$GITHUB_REPOSITORY/actions/artifacts/12816776641/zip" > /tmp/rc7c-baseline.zip
          python3 - <<'PY'
          import zipfile
          with zipfile.ZipFile('/tmp/rc7c-baseline.zip') as z:
              names=[n for n in z.namelist() if n.endswith('.apk')]
              assert len(names)==1,names
              open('/tmp/likas-rc7c.apk','wb').write(z.read(names[0]))
          PY
      - name: Prepare private research build and instrumentation binaries
        run: |
          python3 scripts/prepare_mdd_mammals.py
          python3 scripts/prepare_offline_photos.py
          python3 scripts/audit_inaturalist_photos.py --install-approved
          gradle --no-daemon :app:assembleDebug :app:assembleDebugAndroidTest
      - name: Enable Linux KVM for Android
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run 320dp API34 emulator and backup tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_4
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -no-snapshot
          disable-animations: true
          script: bash scripts/run_emulator_rc7_qa.sh
      - name: Upload screenshots, hierarchy and failed test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: LIKAS-RC7-device-emulator-evidence
          path: emulator-qa/
          if-no-files-found: warn
          retention-days: 7
