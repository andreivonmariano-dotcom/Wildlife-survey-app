name: LIKAS RC70 private references build logic
on:
  push:
    branches: [feature/likas-rc70-private-bundled-references]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify-source-and-public-fallback:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - run: sdkmanager --install 'platforms;android-35' 'build-tools;35.0.0' 'platform-tools'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - uses: actions/cache@v4
        with:
          path: .taxonomy-cache/mdd-v2.5.csv
          key: mdd-v2.5-533e662fd5b8f66a5f56c191e7efac44
      - uses: actions/cache/restore@v4
        with:
          path: .signing/wildlife-beta08.keystore
          key: wildlife-v08-beta-debug-signing-v1
      - name: Verify signer, identity, version and privacy boundary
        run: |
          test -s .signing/wildlife-beta08.keystore
          keytool -exportcert -keystore .signing/wildlife-beta08.keystore -storepass android -alias androiddebugkey -file /tmp/likas-cert.der
          echo 'f7c471ad310aeeffd2b2a7cf7c371c6efdce258560a818b52be5e1f2a7509937  /tmp/likas-cert.der' | sha256sum -c -
          grep -F "applicationId 'org.phwildlife.survey.beta08'" app/build.gradle
          grep -F "versionCode 130" app/build.gradle
          grep -F "super(context,NAME,null,28)" app/src/main/java/org/phwildlife/survey/FieldDb.java
          test ! -e app/private-assets/paic714_master.csv
          test ! -e app/private-assets/paic_worldcover2020_500m.txt
      - name: Scientific and continuity regressions
        run: |
          python3 -m unittest discover -s scripts -p 'test_*.py'
          python3 scripts/prepare_mdd_mammals.py
          python3 scripts/prepare_offline_photos.py
          python3 scripts/audit_inaturalist_photos.py --install-approved
      - name: JVM tests and signed public fallback compilation
        run: gradle --no-daemon :app:testDebugUnitTest :app:assembleDebug :app:assembleDebugAndroidTest
      - name: Upload code130 source-only preview (no private references)
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: LIKAS-RC70-Public-Fallback-code130-no-private-references
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 4
