name: PAIC Raster Archive Inventory QA
on:
  push:
    branches:
      - feature/likas-paic-raster-archive-qa-v04
  workflow_dispatch:
  pull_request:
    paths:
      - 'scripts/likas_paic_raster_archive_inventory.py'
      - 'scripts/test_likas_paic_raster_archive_inventory.py'
      - '.github/workflows/paic-raster-inventory-qa.yml'
permissions:
  contents: read
jobs:
  archive-inventory-qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile scientific inventory source
        run: python -m py_compile scripts/likas_paic_raster_archive_inventory.py scripts/test_likas_paic_raster_archive_inventory.py
      - name: Run synthetic archive QA (no private observations or rasters)
        run: python -m unittest discover -s scripts -p 'test_likas_paic_raster_archive_inventory.py' -v
