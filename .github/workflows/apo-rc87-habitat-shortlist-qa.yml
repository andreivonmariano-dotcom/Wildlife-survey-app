name: APO RC87 habitat shortlist and recent taxa

on:
  pull_request:
    branches:
      - feature/apo-recorder-picker-rc86-interactive-v146
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: apo-habitat-shortlist-v147-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - run: sdkmanager --install 'platforms;android-35' 'build-tools;35.0.0' 'platform-tools'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - uses: actions/cache@v4
        with:
          path: .taxonomy-cache/mdd-v2.5.csv
          key: mdd-v2.5-533e662fd5b8f66a5f56c191e7efac44
      - uses: actions/cache/restore@v4
        with:
          path: .signing/wildlife-beta08.keystore
          key: wildlife-v08-beta-debug-signing-v1
      - name: Restore exact immutable APO artwork
        run: |
          echo '1eebf91314a3ead7038da98866f21c7582ffcfcf4f8da3f3c20e1d2723a69dfa  app/locked/apo_v132_assets.zip' | sha256sum -c -
          unzip -oq app/locked/apo_v132_assets.zip 'app/src/main/assets/apo_official_master.png' 'app/src/main/res/drawable-nodpi/apo_splash_mark.png' 'app/src/main/res/drawable-nodpi/apo_launcher_foreground.png' -d .
          echo '6fe44e5117e0bde953b529735bc7d61a633f39201097a2fd68cd560e914ba0e7  app/src/main/assets/apo_official_master.png' | sha256sum -c -
          echo 'a194803302b7e6c884068ff4e3e3926ba4a4e4110986e599e09a2e6dd7fd22bc  app/src/main/res/drawable-nodpi/apo_splash_mark.png' | sha256sum -c -
          echo '2a60cc5cda8dba006c1c713f15d565c4599ad5ec1bcaebadc7690cb66445af00  app/src/main/res/drawable-nodpi/apo_launcher_foreground.png' | sha256sum -c -
      - name: Require retained Android signer
        run: |
          test -s .signing/wildlife-beta08.keystore
          keytool -exportcert -keystore .signing/wildlife-beta08.keystore -storepass android -alias androiddebugkey -file /tmp/apo-original-cert.der
          echo 'f7c471ad310aeeffd2b2a7cf7c371c6efdce258560a818b52be5e1f2a7509937  /tmp/apo-original-cert.der' | sha256sum -c -
      - name: Scientific and menu source regression tests
        run: |
          python3 -m unittest discover -s scripts -p 'test_*.py'
          python3 scripts/prepare_mdd_mammals.py
          python3 scripts/prepare_offline_photos.py
          python3 scripts/audit_inaturalist_photos.py --install-approved
      - name: JVM unit tests and debug APK build
        run: gradle --no-daemon :app:testDebugUnitTest :app:assembleDebug :app:assembleDebugAndroidTest
      - name: Verify signed APK and references
        run: |
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | grep -F "name='org.phwildlife.survey.beta08'"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | grep -F "versionCode='147'"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | grep -F "versionName='0.27.3-rc87-apo-habitat-shortlist'"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK" | grep -iF 'f7c471ad310aeeffd2b2a7cf7c371c6efdce258560a818b52be5e1f2a7509937'
          unzip -t "$APK" >/dev/null
          unzip -p "$APK" assets/apo_official_master.png | sha256sum | grep -F '6fe44e5117e0bde953b529735bc7d61a633f39201097a2fd68cd560e914ba0e7'
          unzip -p "$APK" assets/paic714_master.csv | sha256sum | grep -F '1ebf7c4ac50787b2dd6f3c22a484057fbac7e61188101bd2f2002c5ce65de959'
          unzip -p "$APK" assets/paic_worldcover2020_500m.txt | sha256sum | grep -F 'e86e0a90096e104f09ee195b70c6cfe44bd6600211a44229973a3a0c80344089'
          sha256sum "$APK"
      - name: Enable hardware-accelerated Android emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Verify live recorder and species picker at 160% and 200% / 320dp
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_4
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -no-snapshot
          script: |
            mkdir -p emulator-evidence
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb shell pm grant org.phwildlife.survey.beta08 android.permission.ACCESS_FINE_LOCATION
            adb shell pm grant org.phwildlife.survey.beta08 android.permission.ACCESS_COARSE_LOCATION
            adb shell settings put system font_scale 1.6
            gradle --no-daemon :app:connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=org.phwildlife.survey.RecorderUiEmulatorTest,org.phwildlife.survey.RecorderPickerCompactEmulatorTest
            adb pull /sdcard/Pictures/APO/apo_recorder_160pct.png emulator-evidence/recorder_160.png
            for group in birds amphibians; do adb pull "/sdcard/Pictures/APO/apo_picker_${group}_160.png" "emulator-evidence/picker_${group}_160.png" || exit 1; done
            adb shell wm size 960x2160
            adb shell settings put system font_scale 2.0
            gradle --no-daemon :app:connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=org.phwildlife.survey.RecorderUiEmulatorTest,org.phwildlife.survey.RecorderPickerCompactEmulatorTest
            adb pull /sdcard/Pictures/APO/apo_recorder_200pct_320dp.png emulator-evidence/recorder_200.png
            for group in birds amphibians; do adb pull "/sdcard/Pictures/APO/apo_picker_${group}_200.png" "emulator-evidence/picker_${group}_200.png" || exit 1; done
            python3 -c "from pathlib import Path; import struct,hashlib; files=list(Path('emulator-evidence').glob('*.png')); assert len(files)==6,files; images=[p.read_bytes() for p in files]; assert all(len(x)>16000 and x[:8]==bytes.fromhex('89504e470d0a1a0a') for x in images); shapes={p.name:struct.unpack('>II',p.read_bytes()[16:24]) for p in files}; assert all(shapes[p.name]==((1080,2280) if '160' in p.name else (960,2160)) for p in files),shapes; assert len({hashlib.sha256(x).hexdigest() for x in images})==6,'Duplicate recorder/picker screenshots'; print('Verified recorder and Bird/Amphibian species pickers',shapes)"
      - name: Upload emulator screenshot evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: APO-v147-habitat-shortlist-emulator-evidence
          path: emulator-evidence/
          if-no-files-found: ignore
          retention-days: 7
      - name: Export signed candidate for direct in-chat download
        uses: actions/upload-artifact@v4
        with:
          name: APO-v147-habitat-shortlist-emulator-signed-preview
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7
