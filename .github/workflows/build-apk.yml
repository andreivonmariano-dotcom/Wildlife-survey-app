name: Build Android Debug APK
on:
  push:
    branches: [main, 'feature/v0.16-gps-preflight', 'feature/v0.17-likas-ui', 'feature/v0.17.1-ui-review', 'feature/v0.18-taxonomy', 'feature/v0.18.1-auto-gps', 'feature/v0.18.2-sy-checklists', 'feature/v0.18.3-species-evidence', 'feature/v0.18.4-wbcp-birds', 'feature/v0.18.4-survey-close-actions', 'feature/v0.18.6-complete-checklists', 'feature/v0.18.7-bundled-checklists', 'feature/v0.19-identify-species', 'feature/v0.19.2-species-sort-score', 'feature/v0.19.3-habitat-profiles-ui', 'feature/v0.19.4-auto-elevation', 'feature/v0.19.5-ui-audit-cleanup', 'feature/v0.19.6-forest-branding-field-flow', 'feature/v0.19.7-approved-artwork', 'feature/v0.19.8-minimal-frog-icon', 'feature/v0.19.9-frog-theme-smooth-forest', 'feature/v0.20-optional-survey-start-gps', 'feature/v0.21-field-layout-refresh', 'feature/v0.22-taxon-forms-species-history', 'feature/v0.23-acoustic-analysis-and-trap-protocols', 'feature/v0.24-coverboard-area-sign-protocols', 'feature/v0.25-spotlight-evidence-study-protocols', 'feature/v0.26-screen-declutter-conflict-audit']
  pull_request:
    branches: ['feature/v0.25-spotlight-evidence-study-protocols', 'feature/v0.24-coverboard-area-sign-protocols', main]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - name: Install required Android SDK
        run: sdkmanager --install 'platforms;android-35' 'build-tools;35.0.0' 'platform-tools'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Restore persistent v0.8 Beta signing key
        uses: actions/cache@v4
        with:
          path: .signing/wildlife-beta08.keystore
          key: wildlife-v08-beta-debug-signing-v1
      - name: Create signing key when new
        run: |
          mkdir -p .signing
          if [ ! -f .signing/wildlife-beta08.keystore ]; then
            keytool -genkeypair -keystore .signing/wildlife-beta08.keystore -storepass android -keypass android -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Wildlife Survey Beta Debug, O=Field Research, C=PH" -noprompt
          fi
      - name: Validate taxonomy source and import rules
        run: python3 -m unittest discover -s scripts -p 'test_*.py'
      - name: Prepare attributed offline Philippine mammals from official MDD v2.5
        run: python3 scripts/prepare_mdd_mammals.py
      - name: Build debug APK
        run: gradle --no-daemon :app:testDebugUnitTest :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: wildlife-survey-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
      - name: Publish APK directly to GitHub Releases
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v0.26.0-beta"
          FILE="app/build/outputs/apk/debug/app-debug.apk"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$FILE" --clobber
          else
            gh release create "$TAG" "$FILE" --title "LIKAS Beta v0.26.0" --notes "Cleaner field recorder and setup, method-aware History, truthful legacy outcomes and complete original-photo exports." --prerelease --target "$GITHUB_SHA"
          fi
