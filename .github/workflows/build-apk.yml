name: Build Android Debug APK
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - name: Install required Android SDK
        run: sdkmanager --install 'platforms;android-35' 'build-tools;35.0.0' 'platform-tools'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Preserve beta debug signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: wildlife-beta-debug-signing-key-v1
      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: wildlife-survey-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
      - name: Publish APK directly to GitHub Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v0.7.0-beta"
          FILE="app/build/outputs/apk/debug/app-debug.apk"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$FILE" --clobber
          else
            gh release create "$TAG" "$FILE" --title "Wildlife Survey Beta v0.7" --notes "Android beta with survey history, project/site register, bird distance quality, CSV and audit exports. Experimental field build, not yet field-validated." --prerelease --target "$GITHUB_SHA"
          fi
