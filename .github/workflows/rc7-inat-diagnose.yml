name: LIKAS iNat API photo inspection
on:
  push:
    branches: [feature/likas-core-fieldwork-post-rc4]
    paths:
      - scripts/diagnose_inaturalist_photo_api.py
      - .github/workflows/rc7-inat-diagnose.yml
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python3 scripts/diagnose_inaturalist_photo_api.py
      - uses: actions/upload-artifact@v4
        with:
          name: LIKAS-iNat-photo-metadata-diagnostic
          path: rc7_photo_api_diagnostic.json
          retention-days: 2
