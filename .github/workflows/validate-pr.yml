name: Validate LIKAS pull request

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - name: Install Android SDK
        run: sdkmanager --install 'platforms;android-35' 'build-tools;35.0.0' 'platform-tools'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Create temporary CI signing key
        run: |
          mkdir -p .signing
          keytool -genkeypair -keystore .signing/wildlife-beta08.keystore -storepass android -keypass android -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 1 -dname "CN=LIKAS PR Compile Only, O=CI, C=PH" -noprompt
      - name: Run unit tests and compile debug app
        run: gradle --no-daemon :app:testDebugUnitTest :app:assembleDebug
