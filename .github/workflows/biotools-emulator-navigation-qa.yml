name: LIKAS BioTools Android 14 navigation acceptance

on:
  push:
    branches:
      - feature/likas-biotools-navigation-audit-20261102
  workflow_dispatch:

permissions:
  contents: read

jobs:
  navigation-emulator:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - uses: actions/cache@v4
        with:
          path: .taxonomy-cache/mdd-v2.5.csv
          key: mdd-v2.5-533e662fd5b8f66a5f56c191e7efac44
      - uses: actions/cache/restore@v4
        with:
          path: .signing/wildlife-beta08.keystore
          key: wildlife-v08-beta-debug-signing-v1
      - name: Prepare source assets and compile instrumentation
        run: |
          python3 scripts/prepare_mdd_mammals.py
          python3 scripts/prepare_offline_photos.py
          python3 scripts/audit_inaturalist_photos.py --install-approved
          gradle --no-daemon :app:assembleDebug :app:assembleDebugAndroidTest
      - name: Test on Android 14 emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_4
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          script: bash scripts/run_biotools_emulator_qa.sh
      - name: Upload emulator test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: LIKAS-BioTools-API34-navigation-evidence
          path: biotools-emulator-qa/
          if-no-files-found: ignore
          retention-days: 7
