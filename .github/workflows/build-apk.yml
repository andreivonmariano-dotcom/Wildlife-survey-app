name: Build Android Debug APK
on:
  push:
    branches: [main, 'feature/v0.16-gps-preflight']
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - name: Install required Android SDK
        run: sdkmanager --install 'platforms;android-35' 'build-tools;35.0.0' 'platform-tools'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Restore persistent v0.8 Beta signing key
        uses: actions/cache@v4
        with:
          path: .signing/wildlife-beta08.keystore
          key: wildlife-v08-beta-debug-signing-v1
      - name: Create signing key when new
        run: |
          mkdir -p .signing
          if [ ! -f .signing/wildlife-beta08.keystore ]; then
            keytool -genkeypair -keystore .signing/wildlife-beta08.keystore -storepass android -keypass android -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Wildlife Survey Beta Debug, O=Field Research, C=PH" -noprompt
          fi
      - name: Build debug APK
        run: gradle --no-daemon :app:testDebugUnitTest :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: wildlife-survey-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
      - name: Publish APK directly to GitHub Releases
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v0.16.0-beta"
          FILE="app/build/outputs/apk/debug/app-debug.apk"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$FILE" --clobber
          else
            gh release create "$TAG" "$FILE" --title "Wildlife Survey Beta v0.16" --notes "GNSS preflight with strict fresh <10 m reported accuracy before survey start; schema 12 retains and exports survey-start GPS, and MDD taxonomy flags remain visible. Physical handset validation required." --prerelease --target "$GITHUB_SHA"
          fi
