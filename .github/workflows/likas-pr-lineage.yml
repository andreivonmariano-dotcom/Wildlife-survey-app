name: APO | Historical RC4 ancestry audit (manual)

# Archived RC4-only contract. New APO lineage uses current branch's
# signed Android QA and data-preservation checks.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rc4-source-gate:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch trusted default-branch audit code
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - name: Fetch candidate commit without running its code
        env:
          CANDIDATE_SHA: ${{ github.event.pull_request.head.sha }}
        run: git fetch --no-tags origin "$CANDIDATE_SHA"
      - name: Require RC4 ancestry and reviewed sprite assets
        env:
          CANDIDATE_SHA: ${{ github.event.pull_request.head.sha }}
        run: python3 scripts/check_pr_against_rc4.py "$CANDIDATE_SHA"
