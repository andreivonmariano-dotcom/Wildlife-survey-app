name: Build Android Debug APK
on:
  push:
    branches: [main, 'release/v0.27-integrated-ux-performance-qa', 'ui/v0.27.1-field-polish-quality-labels']
  pull_request:
    branches: [main, 'release/v0.27-integrated-ux-performance-qa']
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - name: Install required Android SDK
        run: sdkmanager --install 'platforms;android-35' 'build-tools;35.0.0' 'platform-tools'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Restore persistent v0.8 Beta signing key
        uses: actions/cache@v4
        with:
          path: .signing/wildlife-beta08.keystore
          key: wildlife-v08-beta-debug-signing-v1
      - name: Create signing key when new
        run: |
          mkdir -p .signing
          if [ ! -f .signing/wildlife-beta08.keystore ]; then
            keytool -genkeypair -keystore .signing/wildlife-beta08.keystore -storepass android -keypass android -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Wildlife Survey Beta Debug, O=Field Research, C=PH" -noprompt
          fi
      - name: Validate taxonomy source and import rules
        run: python3 -m unittest discover -s scripts -p 'test_*.py'
      - name: Cache checksum-pinned mammal taxonomy source
        uses: actions/cache@v4
        with:
          path: .taxonomy-cache/mdd-v2.5.csv
          key: mdd-v2.5-533e662fd5b8f66a5f56c191e7efac44
      - name: Prepare attributed offline Philippine mammals from official MDD v2.5
        run: |
          for attempt in 1 2 3; do
            if python3 scripts/prepare_mdd_mammals.py; then exit 0; fi
            if [ "$attempt" -eq 3 ]; then
              echo "MDD source unavailable after three verified attempts" >&2
              exit 1
            fi
            sleep 12
          done
      - name: Build debug APK
        run: gradle --no-daemon :app:testDebugUnitTest :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: wildlife-survey-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
      - name: Publish APK directly to GitHub Releases
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v0.27.2-rc3"
          FILE="app/build/outputs/apk/debug/app-debug.apk"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$FILE" --clobber
          else
            gh release create "$TAG" "$FILE" --title "LIKAS release candidate v0.27.2" --notes "Integrated wildlife methods, station GPS accuracy display fix, screen clarity and tested additive SQLite migration. Handset QA pending." --prerelease --target "$GITHUB_SHA"
          fi
